spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tennis_results
    username: ${DB_USER:tennis_user}
    password: ${DB_PASSWORD:tennis_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8082

app:
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8180,https://*:8280).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
