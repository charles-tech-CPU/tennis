# Configuration de l'analyse SonarQube Cloud (sonarcloud.io)
# A verifier dans SonarCloud : Administration > Information du projet
sonar.organization=charles-tech-cpu
sonar.projectKey=charles-tech-CPU_tennis
sonar.projectName=tennis

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.json

# Le frontend n'a pas encore de tests : on l'exclut du calcul de couverture
sonar.coverage.exclusions=frontend/**
